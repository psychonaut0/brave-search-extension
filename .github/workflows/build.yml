name: Build and publish artifacts

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome and Firefox bundles
        run: bun run build:all

      - name: Zip Chrome bundle
        run: cd dist/chrome && zip -r ../../chrome.zip . && cd ../..

      - name: Zip Firefox bundle
        run: cd dist/firefox && zip -r ../../firefox.zip . && cd ../..

      - name: Pack CRX (signed Chromium install)
        run: |
          echo "${{ secrets.CRX_SECRET_KEY }}" > dist.pem
          bash scripts/crxmake.sh dist/chrome dist.pem
          mv chrome.crx extension.crx

      - name: Upload Chrome zip
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: chrome.zip

      - name: Upload Firefox zip
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: firefox.zip

      - name: Upload CRX
        uses: actions/upload-artifact@v4
        with:
          name: extension-crx
          path: extension.crx
