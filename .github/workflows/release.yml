name: Create Release and Upload Artifacts

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome and Firefox bundles
        run: bun run build:all

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip Chrome bundle
        run: cd dist/chrome && zip -r ../../chrome.zip . && cd ../..

      - name: Zip Firefox bundle
        run: cd dist/firefox && zip -r ../../firefox.zip . && cd ../..

      - name: Pack CRX
        run: |
          echo "${{ secrets.CRX_SECRET_KEY }}" > dist.pem
          bash scripts/crxmake.sh dist/chrome dist.pem
          mv chrome.crx extension.crx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Install

            - **Chrome / Brave / any Chromium**: download `extension.crx` and drag it onto `chrome://extensions` (with Developer mode on), or unzip `chrome.zip` and use "Load unpacked".
            - **Firefox**: install `firefox.zip` via `about:debugging` → "Load Temporary Add-on" (pick the manifest), or sign it for permanent install.
          files: |
            chrome.zip
            firefox.zip
            extension.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
